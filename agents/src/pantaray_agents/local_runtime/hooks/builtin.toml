# Built-in hooks, parsed by pantaray_agents.hooks.definitions at worker start.
#
# The short Insight window must stay 15 minutes: `insight_queue` aligns its run
# identity to that window so the 1h summary neither drops nor double counts it.
[[hooks]]
id = "builtin.insight"
trigger = { every = "15m", align = true, tz = "utc" }
requires = ["owner_settled", "recording_ready"]
run = { job = "generate_insight" }

# Summaries, shortest first: each longer one waits for the shorter ones of its
# window. The offset is the grace after the period ends that lets the last
# short runs of the period finish.
[[hooks]]
id = "builtin.summary_1h"
trigger = { every = "hour", offset = "5m", tz = "utc" }
requires = ["owner_settled"]
run = { job = "summarize_activity", args = { summary_type = "1h" } }

[[hooks]]
id = "builtin.summary_24h"
trigger = { every = "day", offset = "10m", tz = "utc" }
requires = ["owner_settled"]
run = { job = "summarize_activity", args = { summary_type = "24h" } }

[[hooks]]
id = "builtin.summary_1w"
trigger = { every = "week", offset = "15m", tz = "utc" }
requires = ["owner_settled"]
run = { job = "summarize_activity", args = { summary_type = "1w" } }

[[hooks]]
id = "builtin.summary_1m"
trigger = { every = "month", offset = "20m", tz = "utc" }
requires = ["owner_settled"]
run = { job = "summarize_activity", args = { summary_type = "1m" } }

[[hooks]]
id = "builtin.summary_3m"
trigger = { every = "quarter", offset = "30m", tz = "utc" }
requires = ["owner_settled"]
run = { job = "summarize_activity", args = { summary_type = "3m" } }

# Insights and daily summaries start a Memory update at once; finished Action
# turns, chat messages and dismissals ride along with the next one, or start
# one when the oldest has waited one Insight window (which matters when
# recording is off and no Insight comes). A dismissal undone or answered
# before the run is not handed: an answer reaches memory as an Action.
[[hooks]]
id = "builtin.memory_update"
trigger = { on = [
    "insight.recorded",
    "activity_summary.recorded",
    "action.turn_ended",
    "chat.message_recorded",
    "suggestion.dismissed",
] }
if = { "activity_summary.recorded" = { summary_type = "24h" }, "suggestion.dismissed" = "still_dismissed_without_reply" }
deliver = { immediate = ["insight.recorded", "activity_summary.recorded"], max_wait = "15m", collapse = "all" }
requires = ["owner_settled"]
run = { job = "memory_update" }

# A Memory update that took a short Insight asks for a Suggestion. One runs at
# a time; requests that pile up meanwhile leave only the newest. A start comes
# at most once per Insight window after the previous generation start, retries
# included, and a request inside that interval waits for it. The Suggestion job
# holds its own retries to the same interval (`reserve_suggestion_start`).
[[hooks]]
id = "builtin.suggestion"
trigger = { on = ["suggestion.requested"] }
deliver = { immediate = ["suggestion.requested"], collapse = "latest", min_interval = { after = "suggestion.generation_started", duration = "15m" } }
requires = ["owner_settled"]
run = { job = "generate_suggestion" }

# A TODO starts its Action once its start date has come: when it is saved with
# one, and when the local date reaches one. A pass starts every TODO that is
# ready, so a submit that failed leaves the hook due for the next tick. Nobody
# waits on a pickup and its Action fails for good without a connection, so it
# runs only when background work could send.
[[hooks]]
id = "builtin.todo_pickup"
trigger = { on = ["todo.saved"] }
deliver = { immediate = ["todo.saved"], collapse = "latest" }
requires = ["owner_settled", "background_can_send", "todo_ux_enabled"]
run = { job = "todo_pickup" }

[[hooks]]
id = "builtin.todo_pickup_daily"
trigger = { every = "day", tz = "local" }
requires = ["owner_settled", "background_can_send", "todo_ux_enabled"]
run = { job = "todo_pickup" }
