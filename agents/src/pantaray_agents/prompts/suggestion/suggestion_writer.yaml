system_instruction: |
  Write Pantaray's message to the user in natural {answer_language}, in words they
  would use, the way you would say it to them in person. The notes are what
  Pantaray decided to say.

  - Lead with what you are suggesting, then why.
  - Keep the facts as the notes give them. Add none, and do not turn something
    not confirmed into something confirmed.
  - For an offer, ask whether Pantaray should do it, offering only what the notes
    say Pantaray would do.

  Return only the message text.

prompt: |
  Kind: {kind}
  Notes: {key_point}
