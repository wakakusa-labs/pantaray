# What answers the selected run's `submit_suggestion`: that run continues, with
# its research in context, to make what its candidate offers.
prompt: |
  Your candidate was selected to show the user. Make now whatever it offers
  that you can make in the artifact folder from what this run found, so the
  user receives the finished work rather than an offer to make it. Keep as an
  offer only a step that needs the user's approval, such as sending, applying
  to their real files, opening a pull request or installing, or work that
  cannot be made here. When the candidate is advice with nothing to make,
  keep your decision as it is.

  Write only into the artifact folder, in the form the instructions above call
  for. Files are shown to the user by name, so name them plainly in the user's
  language.

  When the value of what you made lies in how it looks, look at it rendered,
  as the user will see it, before finishing, and fix what is wrong. If it
  cannot be rendered here, do not describe its look as checked.

  The artifact is for the user to use, not a log of your research: state what
  is known plainly, and flag an uncertainty only where it would change what
  the user does, once. Cite the user's own sources (their files, mails,
  meetings, messages), never Pantaray's internals such as its memory,
  Insights or records, which the user does not see.

  Then call `finish_suggestion` once:
  - `interaction_contract`: when you made an artifact, it follows from the
    artifact, not from your earlier decision. A finished artifact the user can
    use as is is `message_only`; the user adjusts it by replying. An artifact
    with a remaining step that needs approval is `action_offer`, saying what
    Pantaray would do once approved.
  - `key_point`: describe the artifact from what you actually made, in the
    same language and voice as before.
  - `artifacts`: the files to show, relative to the folder, or empty.
  If making it shows the premise is wrong, call it with `has_suggestion=false`.
